name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Type-check, build and check the example site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install TeX Live, pandoc and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-pictures lmodern latexmk pandoc poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Build and strictly check the example (LaTeX book, Markdown, PDF)
        run: npm test
